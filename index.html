<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Prep Inventory</title>
<style>
  :root { --blue:#1F3A5F; --bg:#f4f6f8; --card:#fff; --line:#d9dee4; --text:#1b1f24; --muted:#5b6672;
          --green:#2e7d32; --red:#c62828; --amber:#b26a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         background:var(--bg); color:var(--text); font-size:16px; }
  header { background:var(--blue); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
           display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  #sync { font-size:12px; opacity:.85; }
  main { padding:12px 12px 90px; max-width:640px; margin:0 auto; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
        display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; border:0; background:none; padding:12px 0 14px; font-size:14px; color:var(--muted); }
  nav button.on { color:var(--blue); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; }
  button.btn { border:0; border-radius:10px; padding:12px 14px; font-size:16px; background:var(--blue); color:#fff; }
  button.btn.alt { background:#e8edf3; color:var(--blue); }
  button.btn.red { background:var(--red); }
  button.btn.green { background:var(--green); }
  button.btn:disabled { opacity:.5; }
  input, select { font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; }
  label { font-size:13px; color:var(--muted); display:block; margin:10px 0 4px; }
  .item { padding:12px 4px; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .name { font-weight:600; }
  .meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#eee; margin-left:6px; }
  .s-Complete { background:#d9ead3; color:var(--green); } .s-Short { background:#f4cccc; color:var(--red); }
  .s-Notcounted { background:#fce5cd; color:var(--amber); }
  #reader { width:100%; border-radius:12px; overflow:hidden; background:#000; }
  #toast { position:fixed; left:12px; right:12px; bottom:84px; background:#222; color:#fff; padding:12px 14px;
           border-radius:10px; display:none; z-index:20; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:10; }
  .sheet .panel { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0;
                  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:85vh; overflow:auto; }
  .qtyrow { display:flex; gap:8px; margin-top:12px; }
  .qtyrow button { flex:1; }
  .stepper { display:flex; gap:8px; align-items:center; }
  .stepper button { width:52px; }
  .stepper input { text-align:center; font-size:20px; }
  .hidden { display:none !important; }
  h2 { font-size:17px; margin:0 0 8px; }
  .small { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header><h1>Prep Inventory</h1><span id="sync">not loaded</span></header>
<main>
  <!-- SCAN -->
  <section id="view-scan">
    <div class="card">
      <div id="reader" class="hidden"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn grow" id="btnScan">Scan a barcode</button>
        <button class="btn alt hidden" id="btnStop">Stop</button>
      </div>
      <button class="btn alt" id="btnPhoto" style="width:100%;margin-top:8px">Take a photo instead</button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
      <div id="photoReader" class="hidden"></div>
      <p class="small">Tip: hold the barcode level, filling most of the box, about 6-8 inches away.</p>
      <label for="manualCode">Or type the barcode number</label>
      <div class="row"><input id="manualCode" inputmode="numeric" placeholder="e.g. 041196910155">
        <button class="btn alt" id="btnManual">Look up</button></div>
    </div>
    <div id="scanResult"></div>
  </section>

  <!-- SUPPLIES -->
  <section id="view-supplies" class="hidden">
    <div class="card">
      <input id="supSearch" placeholder="Search supplies">
      <div class="row" style="margin-top:8px">
        <select id="supCat" class="grow"><option value="">All categories</option></select>
        <select id="supStatus" class="grow"><option value="">Any status</option><option>Not counted</option>
          <option>Short</option><option>Complete</option><option>Set quantity</option></select>
      </div>
    </div>
    <div class="card" id="supList"></div>
  </section>

  <!-- FOOD -->
  <section id="view-food" class="hidden">
    <div class="card"><input id="foodSearch" placeholder="Search foods"></div>
    <div class="card" id="foodList"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="hidden">
    <div class="card">
      <h2>Connection</h2>
      <label for="setUrl">Back-end web app URL (from Apps Script)</label>
      <input id="setUrl" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocorrect="off">
      <label for="setCode">Access code</label>
      <input id="setCode" autocapitalize="off" autocorrect="off">
      <label for="setWho">Your name (shown in the change log)</label>
      <input id="setWho" placeholder="e.g. Dad">
      <div class="row" style="margin-top:12px">
        <button class="btn grow" id="btnSave">Save and test</button>
      </div>
      <p class="small" id="setMsg"></p>
    </div>
    <div class="card small">
      Counts are saved straight to the Google Sheet and every change is recorded on its Log tab.
      This version needs an internet connection to save. Version <span id="ver"></span>.
    </div>
  </section>
</main>

<nav>
  <button data-view="scan" class="on">Scan</button>
  <button data-view="supplies">Supplies</button>
  <button data-view="food">Food</button>
  <button data-view="settings">Settings</button>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
